<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="32" height="32" viewBox="0 0 32 32">
  <title>閒 the gap — artbitrage.io</title>
  <desc>A door in two leaves. The gap between them opens into a full round moon and closes again: the moon is not drawn, it is the gap, and whatever is behind the door shows through. 閒 (門 + 月, 隙也): moonlight seen through the gap of a door, the first way 間 was written. artbitrage.io, a place to meet art.</desc>
